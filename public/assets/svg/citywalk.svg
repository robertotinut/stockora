<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" class="svg-bg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c78f9;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#38b8f2;stop-opacity:0.25" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0168fa;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4895ef;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background decorative elements -->
  <circle cx="450" cy="300" r="240" fill="url(#grad1)" />
  <circle cx="600" cy="180" r="120" fill="rgba(1,104,250,0.06)" />
  <circle cx="350" cy="450" r="80" fill="rgba(108,92,231,0.08)" />

  <!-- Base Grid / Platform -->
  <polygon points="200,420 500,270 750,380 450,530" fill="#e8ebf5" opacity="0.7"/>
  <polygon points="450,530 750,380 750,400 450,550" fill="#d2d7e8" opacity="0.8"/>
  <polygon points="200,420 450,530 450,550 200,440" fill="#bec6de" opacity="0.8"/>

  <!-- Warehouse / Stock Isometric Cube 1 -->
  <g transform="translate(380, 260)">
    <polygon points="0,-60 60,-30 0,0 -60,-30" fill="#5c78f9"/>
    <polygon points="0,0 60,-30 60,40 0,70" fill="#3c57de"/>
    <polygon points="-60,-30 0,0 0,70 -60,40" fill="#2d45c5"/>
    <!-- Box Lines -->
    <path d="M-60,-30 L0,0 L60,-30" stroke="#7e95fc" stroke-width="2" fill="none"/>
    <path d="M0,0 L0,70" stroke="#253ba6" stroke-width="2" fill="none"/>
  </g>

  <!-- Isometric Cube 2 (Accent) -->
  <g transform="translate(480, 310)">
    <polygon points="0,-45 45,-22 0,0 -45,-22" fill="#00d2d3"/>
    <polygon points="0,0 45,-22 45,30 0,52" fill="#01a3a4"/>
    <polygon points="-45,-22 0,0 0,52 -45,30" fill="#008b8c"/>
  </g>

  <!-- Isometric Cube 3 (Purchase Box) -->
  <g transform="translate(320, 340)">
    <polygon points="0,-50 50,-25 0,0 -50,-25" fill="#a29bfe"/>
    <polygon points="0,0 50,-25 50,35 0,60" fill="#6c5ce7"/>
    <polygon points="-50,-25 0,0 0,60 -50,35" fill="#5848c2"/>
  </g>

  <!-- Dashboard Card Floating UI -->
  <g transform="translate(480, 140)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.06))"/>
    <circle cx="25" cy="25" r="10" fill="#0168fa" opacity="0.15"/>
    <path d="M21 25 L24 28 L29 22" stroke="#0168fa" stroke-width="2" stroke-linecap="round" fill="none"/>
    <rect x="45" y="18" width="60" height="6" rx="3" fill="#0168fa"/>
    <rect x="45" y="28" width="90" height="4" rx="2" fill="#cbd5e1"/>
    <!-- Mini Bar Chart -->
    <rect x="25" y="75" width="12" height="20" rx="2" fill="#cbd5e1"/>
    <rect x="45" y="60" width="12" height="35" rx="2" fill="#cbd5e1"/>
    <rect x="65" y="45" width="12" height="50" rx="2" fill="#0168fa"/>
    <rect x="85" y="65" width="12" height="30" rx="2" fill="#cbd5e1"/>
    <rect x="105" y="50" width="12" height="45" rx="2" fill="#00d2d3"/>
    <rect x="125" y="40" width="12" height="55" rx="2" fill="#6c5ce7"/>
    <rect x="145" y="70" width="12" height="25" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Floating Notification Badge -->
  <g transform="translate(250, 200)">
    <rect x="0" y="0" width="150" height="48" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="#10b981" opacity="0.2"/>
    <circle cx="24" cy="24" r="6" fill="#10b981"/>
    <text x="46" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Stok Siap</text>
    <text x="46" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#64748b">100% Terverifikasi</text>
  </g>

  <!-- Stockora Logo Brand text watermark -->
  <text x="420" y="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="800" fill="#a0aec0" opacity="0.4" letter-spacing="4">STOCKORA</text>
</svg>
